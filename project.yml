# XcodeGen manifest — fallback / regeneration path.
#
#   brew install xcodegen && xcodegen generate
#
# The checked-in tepevesen.xcodeproj is the primary project (Xcode 16
# synchronized folder groups, so new files under tepevesen/ are picked up
# without touching the pbxproj). This manifest exists so the project can be
# regenerated from scratch on any machine.

name: tepevesen
options:
  bundleIdPrefix: engineering.tepevesen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  tepevesen:
    type: application
    platform: iOS
    sources:
      - path: tepevesen
    info:
      path: Config/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: engineering.tepevesen.app
        PRODUCT_NAME: tepevesen
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Config/Info.plist
